<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GamerStore</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <div class="text-center mb-4">
                <a href="index.html" class="navbar-brand fs-3 d-flex align-items-center justify-content-center">
                    <img src="img/logo.png" alt="GamerStore Logo" class="me-2">
                    GAMERSTORE
                </a>
                <p class="text-muted mt-2">Acesse sua conta de campeão</p>
            </div>

            <form id="loginForm"> <!--forma como se cria o login-->
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                    </div>
                    <div id="emailFeedback" class="invalid-feedback d-none">Por favor, insira um e-mail válido.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label> <!--label criado para senha-->
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                    <div id="passwordFeedback" class="invalid-feedback d-none">A senha deve ter pelo menos 6 caracteres.</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input bg-dark border-secondary" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted small" for="rememberMe">Lembrar-me</label>
                    </div>
                    <a href="#" class="text-neon-cyan small text-decoration-none" style="color: var(--neon-cyan);">Esqueci a senha</a>
                </div>

                <button type="submit" class="btn btn-neon w-100 mb-3">Entrar</button>

                <div class="text-center">
                    <p class="text-muted small">Não tem uma conta? <a href="#" class="text-decoration-none" style="color: var(--neon-purple);">Cadastre-se</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap & jQuery JS -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
